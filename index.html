<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual - Interface Limpa e Dinâmica</title>
    <style>
        /* Estilização base ocupando 100% da tela */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Vídeo da câmera traseira */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Alvo central destacado (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff00;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* Painel compacto no topo para não cobrir o centro da tela */
        #controls-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 10;
            text-align: center;
            width: 88%;
            max-height: 40vh; /* Limita a altura para não cobrir o mira */
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .mode-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .mode-btn.active {
            background: #007bff;
            border-color: #007bff;
            font-weight: bold;
        }

        .result-title {
            font-size: 17px;
            font-weight: bold;
            color: #00ff00;
            margin: 4px 0;
        }

        .input-group {
            margin-top: 4px;
            font-size: 11px;
        }

        .input-group input {
            width: 50px;
            padding: 2px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn-action {
            margin-top: 6px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #calibrate-btn { background-color: #6c757d; }
        #action-btn { background-color: #28a745; display: none; }
        #save-btn { background-color: #17a2b8; }
        #toggle-history-btn { background-color: #555; }

        /* Histórico Retrátil (Escondido por padrão) */
        #history-section {
            display: none; /* Inicia oculto para não obstruir */
            margin-top: 10px;
            border-top: 1px solid #444;
            padding-top: 8px;
            text-align: left;
        }

        #history-list {
            list-style: none;
            padding: 0;
            margin: 6px 0;
            max-height: 100px;
            overflow-y: auto;
        }

        #history-list li {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 3px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #permission-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 30px;
            z-index: 10;
            cursor: pointer;
        }

        .error-message { color: #ff4d4d; font-size: 11px; margin-top: 2px; }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <div id="controls-panel">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-dist" onclick="switchMode('dist')">Distância</button>
            <button class="mode-btn" id="btn-mode-height" onclick="switchMode('height')">Altura</button>
        </div>

        <div id="result-display" class="result-title">Distância: -- m</div>
        <div id="sub-info" style="font-size: 11px; color: #aaa;">Elevação: --° | Zero: --°</div>
        <div id="error-display" class="error-message"></div>
        
        <div class="input-group">
            <label for="user-height">Altura da Câmera (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.05" min="0.5" max="2.5">
        </div>

        <div style="margin-top: 6px; display: flex; justify-content: center; gap: 4px; flex-wrap: wrap;">
            <button class="btn-action" id="calibrate-btn" onclick="calibrateHorizon()">1. Calibrar</button>
            <button class="btn-action" id="action-btn" onclick="handleAction()">2. Fixar Base</button>
            <button class="btn-action" id="save-btn" onclick="saveCurrentMeasurement()">Salvar</button>
            <button class="btn-action" id="toggle-history-btn" onclick="toggleHistory()">📋 Histórico</button>
        </div>

        <!-- Seção de Histórico Retrátil -->
        <div id="history-section">
            <strong style="font-size: 12px;">Histórico Guardado</strong>
            <ul id="history-list"></ul>
            <button class="btn-action" style="background: #dc3545; font-size: 10px; padding: 3px 6px;" onclick="clearHistory()">Apagar Tudo</button>
        </div>
    </div>

    <button id="permission-btn">Ativar Sensores e Câmera</button>

    <script>
        // --- 1. ELEMENTOS VISUAIS E ESTADOS ---
        const videoElement = document.getElementById('camera-video');
        const resultDisplay = document.getElementById('result-display');
        const subInfo = document.getElementById('sub-info');
        const errorDisplay = document.getElementById('error-display');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');
        const actionBtn = document.getElementById('action-btn');
        const calibrateBtn = document.getElementById('calibrate-btn');
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');

        let currentMode = 'dist';
        let heightStep = 1;
        let currentPitchDegrees = 0;
        let lastCalculatedValue = 0;
        
        let horizonBeta = 90;
        let isCalibrated = false;
        let storedDistanceMeters = 0;

        let savedMeasurements = JSON.parse(localStorage.getItem('trena_history') || '[]');

        // --- 2. PERMISSÕES E LEITURA CONTÍNUA ---
        permissionBtn.addEventListener('click', async () => {
            errorDisplay.innerText = "";
            const camOk = await startCamera();
            const sensorOk = await requestOrientationPermission();
            if (camOk && sensorOk) {
                permissionBtn.style.display = 'none';
                renderHistory();
            }
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
                return true;
            } catch (err) {
                errorDisplay.innerText = "Erro na câmera: " + err.message;
                return false;
            }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        return true;
                    } else {
                        errorDisplay.innerText = "Giroscópio negado.";
                        return false;
                    }
                } catch (e) {
                    errorDisplay.innerText = "Erro nos sensores.";
                    return false;
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                return true;
            }
        }

        // Executado continuamente a cada movimento do celular
        function handleOrientation(event) {
            if (event.beta !== null) {
                currentPitchDegrees = event.beta;
                updateCalculations(); // Garante atualização em tempo real
            }
        }

        function getElevationDegrees() {
            return currentPitchDegrees - horizonBeta;
        }

        function calibrateHorizon() {
            horizonBeta = currentPitchDegrees;
            isCalibrated = true;
            calibrateBtn.style.backgroundColor = "#17a2b8";
            calibrateBtn.innerText = "Calibrado ✓";
            updateCalculations();
        }

        // --- 3. CÁLCULO TRIGONOMÉTRICO DINÂMICO ---
        function getBaseDistance() {
            const h = parseFloat(userHeightInput.value);
            const elevation = getElevationDegrees();
            if (!Number.isFinite(h) || h <= 0 || elevation >= -2) return null;
            const elevationRad = elevation * (Math.PI / 180);
            return -h / Math.tan(elevationRad);
        }

        function getObjectHeight(distance) {
            const h = parseFloat(userHeightInput.value);
            const elevation = getElevationDegrees();
            if (!Number.isFinite(h) || h <= 0) return 0;
            const elevationRad = elevation * (Math.PI / 180);
            return h + (distance * Math.tan(elevationRad));
        }

        // --- 4. ATUALIZAÇÃO DA TELA EM TEMPO REAL ---
        function updateCalculations() {
            const elevation = getElevationDegrees();
            const subText = `Elevação: ${elevation.toFixed(1)}° | Zero: ${horizonBeta.toFixed(1)}°`;

            if (currentMode === 'dist') {
                const d = getBaseDistance();
                if (d === null) {
                    resultDisplay.innerText = isCalibrated ? "Mire no CHÃO" : "Calibre em frente";
                    subInfo.innerText = subText;
                    lastCalculatedValue = 0;
                } else {
                    lastCalculatedValue = d;
                    // ATUALIZAÇÃO DINÂMICA: Exibe o valor em tempo real conforme você move o celular
                    resultDisplay.innerText = `Distância: ${d.toFixed(2)} m`;
                    subInfo.innerText = `${subText} | ${(d * 100).toFixed(0)} cm`;
                }
            } else if (currentMode === 'height' && heightStep === 2) {
                const totalHeight = getObjectHeight(storedDistanceMeters);
                lastCalculatedValue = totalHeight;
                resultDisplay.innerText = `Altura: ${totalHeight.toFixed(2)} m`;
                subInfo.innerText = `Dist. Base: ${storedDistanceMeters.toFixed(2)}m | ${subText}`;
            }
        }

        // --- 5. HISTÓRICO RETRÁTIL E SALVAMENTO ---
        function toggleHistory() {
            const isHidden = historySection.style.display === 'none' || historySection.style.display === '';
            historySection.style.display = isHidden ? 'block' : 'none';
        }

        function saveCurrentMeasurement() {
            if (lastCalculatedValue <= 0) {
                alert("Nenhuma medição válida no momento para salvar.");
                return;
            }

            const label = prompt("Nome da medição:", currentMode === 'dist' ? "Distância" : "Altura");
            if (label === null) return;

            const item = {
                id: Date.now(),
                label: label || (currentMode === 'dist' ? "Distância" : "Altura"),
                type: currentMode === 'dist' ? "Distância" : "Altura",
                value: lastCalculatedValue.toFixed(2)
            };

            savedMeasurements.push(item);
            localStorage.setItem('trena_history', JSON.stringify(savedMeasurements));
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = "";
            if (savedMeasurements.length === 0) {
                historyList.innerHTML = "<li style='color: #aaa;'>Nenhum registro.</li>";
                return;
            }

            savedMeasurements.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${item.label}:</strong> ${item.value} m</span>
                                <button onclick="deleteHistoryItem(${item.id})" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">✕</button>`;
                historyList.appendChild(li);
            });
        }

        function deleteHistoryItem(id) {
            savedMeasurements = savedMeasurements.filter(item => item.id !== id);
            localStorage.setItem('trena_history', JSON.stringify(savedMeasurements));
            renderHistory();
        }

        function clearHistory() {
            if (confirm("Apagar todo o histórico?")) {
                savedMeasurements = [];
                localStorage.removeItem('trena_history');
                renderHistory();
            }
        }

        // --- 6. TROCA DE MODO ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-dist').classList.toggle('active', mode === 'dist');
            document.getElementById('btn-mode-height').classList.toggle('active', mode === 'height');
            
            if (mode === 'dist') {
                actionBtn.style.display = 'none';
                updateCalculations();
            } else {
                resetHeightState();
            }
        }

        function resetHeightState() {
            heightStep = 1;
            storedDistanceMeters = 0;
            actionBtn.style.display = 'inline-block';
            actionBtn.innerText = "2. Fixar Base";
            actionBtn.style.backgroundColor = "#28a745";
            actionBtn.style.color = "#fff";
            resultDisplay.innerText = "Mire na BASE";
            subInfo.innerText = "Mire no chão e fixe a base";
        }

        function handleAction() {
            if (heightStep === 1) {
                const d = getBaseDistance();
                if (d === null) {
                    alert("Mire no chão para fixar a base.");
                    return;
                }
                storedDistanceMeters = d;
                heightStep = 2;
                actionBtn.innerText = "3. Medir Topo";
                actionBtn.style.backgroundColor = "#ffc107";
                actionBtn.style.color = "#000";
                resultDisplay.innerText = "Mire no TOPO";
                subInfo.innerText = `Base salva (${d.toFixed(2)}m). Erga o celular!`;
            } else {
                resetHeightState();
            }
        }

        userHeightInput.addEventListener('input', updateCalculations);
    </script>
</body>
</html>
