<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual Pro - Auto-Altura</title>
    <style>
        /* 1. ESTILOS BASE E LAYOUT */
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
        }

        #camera-video {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover; z-index: 1;
        }

        /* 2. MIRA INTELIGENTE */
        :root { --crosshair-color: #ff4d4d; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 28px; height: 28px; transform: translate(-50%, -50%);
            border: 2.5px solid var(--crosshair-color); border-radius: 50%;
            z-index: 5; pointer-events: none; box-shadow: 0 0 8px rgba(0,0,0,0.6);
            transition: border-color 0.3s ease;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: var(--crosshair-color);
            transform: translate(-50%, -50%); border-radius: 50%;
        }

        /* 3. VISUALIZADOR 2D */
        #visualizer-container {
            position: absolute; top: 20px; left: 20px;
            background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(8px);
            border-radius: 12px; padding: 10px; z-index: 15;
            border: 1px solid rgba(255, 255, 255, 0.1); opacity: 0.3;
        }
        #visualizer-container span {
            display: block; color: #aaa; font-size: 10px; text-align: center;
            margin-bottom: 5px; font-weight: bold;
        }

        /* 4. PAINEL PRINCIPAL */
        #controls-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(12px);
            color: #ffffff; padding: 12px 16px; border-radius: 16px;
            font-size: 13px; z-index: 10; text-align: center; width: 90%;
            max-height: 55vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .mode-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .mode-btn {
            background: rgba(255,255,255,0.1); color: #ccc; border: none;
            padding: 6px 14px; border-radius: 12px; cursor: pointer; font-size: 13px;
        }
        .mode-btn.active {
            background: #007aff; color: #fff; font-weight: bold;
        }

        .result-title { font-size: 24px; font-weight: 900; color: #fff; margin: 4px 0; }
        
        .input-group { margin-top: 8px; font-size: 12px; color: #ddd; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .input-group input {
            width: 55px; padding: 4px; text-align: center; border-radius: 6px;
            border: 1px solid #555; background: rgba(0,0,0,0.5); color: #fff; font-weight: bold;
        }

        /* Botão para ativar o cálculo automático da altura */
        #auto-height-btn {
            background: #8e8e93; color: white; border: none; border-radius: 6px;
            padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: bold;
        }

        /* Overlay de Instrução para Auto-Altura */
        #auto-height-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 100; color: white;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }

        .actions-grid { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .btn-action {
            padding: 8px 12px; font-size: 12px; font-weight: bold; color: #fff;
            border: none; border-radius: 12px; cursor: pointer;
        }

        #calibrate-btn { background-color: #5e5ce6; }
        #action-btn { background-color: #34c759; display: none; }
        #save-btn { background-color: #ff9f0a; }

        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 16px 32px; font-size: 16px; font-weight: bold; color: #fff;
            background: linear-gradient(135deg, #007aff, #5e5ce6); border: none;
            border-radius: 30px; z-index: 20;
        }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <div id="visualizer-container">
        <span>Visão Lateral</span>
        <svg id="triangle-svg" width="130" height="130">
            <polygon id="triangle-polygon" points="10,10 10,110 110,110" fill="rgba(50, 215, 75, 0.2)" stroke="#32d74b" stroke-width="2"/>
            <text id="text-h" x="12" y="60" fill="#fff" font-size="11" transform="rotate(-90 12,60)">1.50m</text>
            <text id="text-d" x="60" y="125" fill="#fff" font-size="11" text-anchor="middle">--m</text>
            <text id="text-ang" x="25" y="25" fill="#ff9f0a" font-size="12" font-weight="bold">--°</text>
        </svg>
    </div>

    <!-- OVERLAY DO MODO AUTO-ALTURA -->
    <div id="auto-height-overlay">
        <h2>Modo Auto-Altura</h2>
        <p id="auto-height-instructions" style="font-size: 16px; margin: 20px 0;">1. Coloque o telemóvel no chão (virado para cima).<br>2. Clica em "Iniciar" e levanta-o até à altura dos teus olhos.</p>
        <h1 id="live-height-display" style="color: #32d74b; font-size: 48px; margin: 10px 0;">0.00m</h1>
        <button class="btn-action" id="start-auto-btn" style="background: #34c759; padding: 12px 24px; font-size: 16px; margin-top: 20px;" onclick="startAutoHeight()">Iniciar Medição</button>
    </div>

    <div id="controls-panel">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-dist" onclick="switchMode('dist')">Distância</button>
            <button class="mode-btn" id="btn-mode-height" onclick="switchMode('height')">Altura Vertical</button>
        </div>

        <div id="result-display" class="result-title">Calibre o Nível</div>
        <div id="sub-info" style="font-size: 11px; color: #aaa;">Olhe para frente e calibre</div>
        <div id="error-display" style="color: #ff453a; font-size: 11px; margin-top: 2px;"></div>
        
        <div class="input-group">
            <label for="user-height">Altura Calc (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.01" min="0.1" max="2.5">
            <!-- NOVO BOTÃO PARA A AUTO-ALTURA -->
            <button id="auto-height-btn" onclick="openAutoHeight()">Auto-Altura</button>
        </div>

        <div style="margin-top: 6px; font-size: 12px; color: #ffcc00;">
            Segure a exatos: <strong id="real-height-val">1.32</strong><strong>m</strong>
        </div>

        <div class="actions-grid">
            <button class="btn-action" id="calibrate-btn" onclick="calibrateHorizon()">🎯 Calibrar</button>
            <button class="btn-action" id="action-btn" onclick="handleAction()">📍 Fixar Base</button>
            <button class="btn-action" id="save-btn" onclick="saveCurrentMeasurement()">💾 Salvar</button>
        </div>
    </div>

    <button id="permission-btn">Ativar Trena Virtual</button>

    <script>
        const videoElement = document.getElementById('camera-video');
        const resultDisplay = document.getElementById('result-display');
        const subInfo = document.getElementById('sub-info');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');
        const rootStyles = document.documentElement;

        const OFFSET_FISICO = 0.18;
        let currentMode = 'dist', heightStep = 1;
        let rawPitch = 0, smoothedPitch = null, horizonBeta = 90;
        let storedDistanceMeters = 0;

        // VARIÁVEIS DA AUTO-ALTURA (Dupla Integração)
        let isTrackingHeight = false;
        let currentVelocity = 0;
        let currentDisplacement = 0;
        let lastTime = 0;
        let accelNoiseGate = 0.4; // Só regista movimento se a aceleração for maior que 0.4 m/s² (Ignora tremores)

        function updatePhysicalInstruction() {
            const calcHeight = parseFloat(userHeightInput.value) || 1.50;
            let realHeight = calcHeight - OFFSET_FISICO;
            document.getElementById('real-height-val').innerText = (realHeight > 0 ? realHeight : 0).toFixed(2);
        }

        const savedCameraHeight = localStorage.getItem('trena_camera_height');
        if (savedCameraHeight) userHeightInput.value = savedCameraHeight; 
        updatePhysicalInstruction();

        userHeightInput.addEventListener('input', () => {
            localStorage.setItem('trena_camera_height', userHeightInput.value);
            updatePhysicalInstruction(); updateCalculations();
        });

        permissionBtn.addEventListener('click', async () => {
            const camOk = await startCamera();
            const sensorOk = await requestOrientationPermission();
            if (camOk && sensorOk) {
                permissionBtn.style.display = 'none';
            }
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = stream; return true;
            } catch (err) { return false; }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                    window.addEventListener('deviceorientation', handleOrientation);
                    
                    // Adicionamos também a permissão para os movimentos lineares (Acelerômetro)
                    await DeviceMotionEvent.requestPermission();
                    window.addEventListener('devicemotion', handleMotion);
                    return true;
                } catch (e) { return false; }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
                return true;
            }
        }

        // --- LÓGICA DO ACELERÔMETRO (AUTO-ALTURA) ---
        function handleMotion(event) {
            if (!isTrackingHeight) return;

            // O acceleration fornece a força excluindo a gravidade.
            // Quando seguramos o celular achatado, o eixo Z aponta para cima.
            // Quando na vertical, o eixo Y aponta para cima. Vamos usar a magnitude do vetor para captar a elevação.
            const accX = event.acceleration.x || 0;
            const accY = event.acceleration.y || 0;
            const accZ = event.acceleration.z || 0;
            
            // Calcula a força total do movimento
            let magnitude = Math.sqrt(accX*accX + accY*accY + accZ*accZ);
            
            // Direção do movimento: assumimos que na fase inicial, o movimento é de subida (positivo).
            // (Numa app comercial como o ARCore, usa-se a câmara para corrigir esta incerteza).
            let linearAcc = (accY > 0 || accZ > 0) ? magnitude : -magnitude;

            // Filtro Passa-Alta (Noise Gate) para ignorar tremores do utilizador e evitar "drift" infinito
            if (Math.abs(linearAcc) < accelNoiseGate) {
                linearAcc = 0;
                // Se parou de acelerar, decai a velocidade para zero (evita que o telemóvel ache que continua a flutuar)
                currentVelocity *= 0.90; 
            }

            const currentTime = performance.now();
            if (lastTime !== 0) {
                const dt = (currentTime - lastTime) / 1000; // Converte milissegundos para segundos

                // DUPLA INTEGRAÇÃO
                // 1. Aceleração altera a Velocidade
                currentVelocity += linearAcc * dt;
                
                // 2. Velocidade altera a Posição (Altura)
                currentDisplacement += currentVelocity * dt;

                // Atualiza a tela do utilizador
                document.getElementById('live-height-display').innerText = currentDisplacement.toFixed(2) + "m";
            }
            lastTime = currentTime;
        }

        function openAutoHeight() {
            document.getElementById('auto-height-overlay').style.display = 'flex';
        }

        function startAutoHeight() {
            const btn = document.getElementById('start-auto-btn');
            
            if (!isTrackingHeight) {
                // Inicia o rastreamento
                isTrackingHeight = true;
                currentVelocity = 0;
                currentDisplacement = 0;
                lastTime = performance.now();
                
                btn.innerText = "Parar e Guardar Altura";
                btn.style.background = "#ff3b30";
                document.getElementById('auto-height-instructions').innerText = "A medir... Levanta o telemóvel na vertical!";
            } else {
                // Para o rastreamento e guarda o valor
                isTrackingHeight = false;
                
                // Soma o Offset Físico ao deslocamento lido para que a matemática do triângulo bata certo
                let finalHeight = currentDisplacement + OFFSET_FISICO;
                if (finalHeight < 0.2) finalHeight = 0.5; // Limite mínimo de segurança
                
                userHeightInput.value = finalHeight.toFixed(2);
                localStorage.setItem('trena_camera_height', finalHeight.toFixed(2));
                updatePhysicalInstruction();
                
                // Reseta a interface
                btn.innerText = "Iniciar Medição";
                btn.style.background = "#34c759";
                document.getElementById('auto-height-instructions').innerText = "1. Coloque o telemóvel no chão...\n2. Clica em 'Iniciar' e levante-o.";
                document.getElementById('auto-height-overlay').style.display = 'none';
                
                updateCalculations();
            }
        }
        // --- FIM DA LÓGICA DO ACELERÔMETRO ---

        function handleOrientation(event) {
            if (event.beta !== null) {
                rawPitch = event.beta;
                if (smoothedPitch === null) smoothedPitch = rawPitch;
                else smoothedPitch = smoothedPitch + 0.25 * (rawPitch - smoothedPitch);
                updateCalculations();
            }
        }

        function calibrateHorizon() {
            horizonBeta = rawPitch; updateCalculations();
        }

        function getBaseDistance(useRaw = false) {
            const h = parseFloat(userHeightInput.value);
            const elevation = (useRaw ? rawPitch : smoothedPitch) - horizonBeta;
            if (!Number.isFinite(h) || h <= 0 || elevation >= -1.5) return null; 
            return -h / Math.tan(elevation * (Math.PI / 180));
        }

        function drawTriangle(distance, cameraHeight, angle) {
            const vis = document.getElementById('visualizer-container');
            if (!distance || distance <= 0) { vis.style.opacity = '0.3'; return; }
            vis.style.opacity = '1';
            let drawW, drawH;
            if (distance > cameraHeight) { drawW = 100; drawH = 100 * (cameraHeight / distance); } 
            else { drawH = 100; drawW = 100 * (distance / cameraHeight); }

            document.getElementById('triangle-polygon').setAttribute('points', `20,15 20,${15 + drawH} ${20 + drawW},${15 + drawH}`);
            
            const textH = document.getElementById('text-h'); textH.textContent = cameraHeight.toFixed(2) + 'm';
            textH.setAttribute('transform', `rotate(-90 12,${15 + drawH / 2})`); textH.setAttribute('y', 15 + drawH / 2);
            
            const textD = document.getElementById('text-d'); textD.textContent = distance.toFixed(2) + 'm';
            textD.setAttribute('x', 20 + drawW / 2); textD.setAttribute('y', 15 + drawH + 12);
        }

        function updateCalculations() {
            const elevation = smoothedPitch - horizonBeta;
            const hCam = parseFloat(userHeightInput.value) || 1.50; 
            if (currentMode === 'dist') {
                const d = getBaseDistance(false);
                if (d === null) {
                    resultDisplay.innerText = "Calibre / Mire p/ Baixo"; drawTriangle(0, hCam, 0);
                } else {
                    resultDisplay.innerText = `${d.toFixed(2)} m`;
                    drawTriangle(d, hCam, elevation);
                }
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-dist').classList.toggle('active', mode === 'dist');
            document.getElementById('btn-mode-height').classList.toggle('active', mode === 'height');
            if (mode === 'dist') { document.getElementById('action-btn').style.display = 'none'; updateCalculations(); }
            else { 
                document.getElementById('action-btn').style.display = 'inline-block'; 
                document.getElementById('action-btn').innerText = "📍 Fixar Base"; 
            }
        }

        function handleAction() {
            const d = getBaseDistance(true); 
            if (d !== null) { document.getElementById('action-btn').innerText = "🔄 Resetar Topo"; }
        }
    </script>
</body>
</html>
