<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual - Altura Corrigida</title>
    <style>
        /* Reset de estilo e layout fullscreen */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Elemento de vídeo da câmera traseira */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Retículo/Mira central */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff00;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* Painel superior de controle */
        #controls-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            font-size: 15px;
            z-index: 10;
            text-align: center;
            width: 85%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .mode-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .mode-btn.active {
            background: #007bff;
            border-color: #007bff;
            font-weight: bold;
        }

        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            margin: 5px 0;
        }

        .input-group {
            margin-top: 8px;
            font-size: 13px;
        }

        .input-group input {
            width: 55px;
            padding: 3px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #action-btn {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            display: none;
        }

        #permission-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 30px;
            z-index: 10;
            cursor: pointer;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <div id="controls-panel">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-dist" onclick="switchMode('dist')">Distância</button>
            <button class="mode-btn" id="btn-mode-height" onclick="switchMode('height')">Altura</button>
        </div>

        <div id="result-display" class="result-title">Distância: -- m</div>
        <div id="sub-info" style="font-size: 12px; color: #aaa;">Inclinação: --°</div>
        <div id="error-display" class="error-message"></div>
        
        <div class="input-group">
            <label for="user-height">Altura do celular (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.05" min="0.5" max="2.5">
        </div>

        <button id="action-btn" onclick="handleAction()">1º Passo: Fixar Base</button>
    </div>

    <button id="permission-btn">Ativar Sensores e Câmera</button>

    <script>
        // --- 1. REFERÊNCIAS VISUAIS E VARIÁVEIS DE ESTADO ---
        const videoElement = document.getElementById('camera-video');
        const resultDisplay = document.getElementById('result-display');
        const subInfo = document.getElementById('sub-info');
        const errorDisplay = document.getElementById('error-display');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');
        const actionBtn = document.getElementById('action-btn');

        let currentMode = 'dist';
        let heightStep = 1;
        let currentPitchDegrees = 0;
        
        // Memória da Medição de Altura
        let storedDistanceMeters = 0;
        let basePitchDegrees = 0; // Ângulo gravado na base (chão)

        // --- 2. INICIALIZAÇÃO DE SENSORES E CÂMERA ---
        permissionBtn.addEventListener('click', async () => {
            errorDisplay.innerText = "";
            const camOk = await startCamera();
            const sensorOk = await requestOrientationPermission();
            if (camOk && sensorOk) {
                permissionBtn.style.display = 'none';
            }
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
                return true;
            } catch (err) {
                errorDisplay.innerText = "Erro ao abrir câmera: " + err.message;
                return false;
            }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        return true;
                    } else {
                        errorDisplay.innerText = "Permissão ao giroscópio negada.";
                        return false;
                    }
                } catch (e) {
                    errorDisplay.innerText = "Erro nos sensores.";
                    return false;
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                return true;
            }
        }

        // --- 3. LEITURA CONTINUA DO GIROSCÓPIO ---
        function handleOrientation(event) {
            if (event.beta !== null) {
                currentPitchDegrees = event.beta;
                updateCalculations();
            }
        }

        // --- 4. TROCA DE MODO E RESET DA TELA ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-dist').classList.toggle('active', mode === 'dist');
            document.getElementById('btn-mode-height').classList.toggle('active', mode === 'height');
            
            if (mode === 'dist') {
                actionBtn.style.display = 'none';
                updateCalculations();
            } else {
                resetHeightState();
            }
        }

        function resetHeightState() {
            heightStep = 1;
            storedDistanceMeters = 0;
            basePitchDegrees = 0;
            actionBtn.style.display = 'inline-block';
            actionBtn.innerText = "1º Passo: Fixar Base (Chão)";
            actionBtn.style.backgroundColor = "#28a745";
            actionBtn.style.color = "#fff";
            resultDisplay.innerText = "Mire na BASE do objeto";
            subInfo.innerText = "Aperte o botão para fixar a distância";
        }

        // --- 5. CÁLCULO DA DISTÂNCIA HORIZONTAL E ALTURA ---
        function getHorizontalDistance() {
            const eyeHeight = parseFloat(userHeightInput.value) || 1.50;
            
            // Quanto mais apontamos para o chão, maior o pitch (ex: > 90°)
            // Ângulo de depressão em relação ao horizonte (90°)
            let depressionAngle = currentPitchDegrees - 90;

            // Se o celular estiver apontado para cima ou na horizontal pura
            if (depressionAngle <= 2 || depressionAngle >= 88) {
                return null;
            }

            const angleRadians = depressionAngle * (Math.PI / 180);
            return eyeHeight * Math.tan(angleRadians);
        }

        function updateCalculations() {
            if (currentMode === 'dist') {
                const d = getHorizontalDistance();
                if (d === null) {
                    resultDisplay.innerText = "Mire para o chão";
                    subInfo.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}°`;
                } else {
                    resultDisplay.innerText = `Distância: ${d.toFixed(2)} m`;
                    subInfo.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}° | ${(d * 100).toFixed(0)} cm`;
                }
            } else if (currentMode === 'height' && heightStep === 2) {
                const eyeHeight = parseFloat(userHeightInput.value) || 1.50;
                
                // Ângulo da base em relação à horizontal (90°)
                let alphaBaseDeg = basePitchDegrees - 90;
                let alphaBaseRad = alphaBaseDeg * (Math.PI / 180);

                // Ângulo atual do topo em relação à horizontal (90°)
                // Quando erguemos o celular, currentPitchDegrees FICA MENOR que 90°
                let alphaTopoDeg = 90 - currentPitchDegrees; 
                let alphaTopoRad = alphaTopoDeg * (Math.PI / 180);

                // LÓGICA DE ALTURA CORRIGIDA:
                // Altura Total = Altura da parte abaixo dos olhos + Altura da parte acima dos olhos
                // h_abaixo = d / tan(alphaBase)  --> que é igual à altura do olho
                // h_acima  = d * tan(alphaTopo)
                let heightAboveEye = storedDistanceMeters * Math.tan(alphaTopoRad);
                let totalHeight = eyeHeight + heightAboveEye;

                if (totalHeight < 0) totalHeight = 0;

                resultDisplay.innerText = `Altura: ${totalHeight.toFixed(2)} m`;
                subInfo.innerText = `Dist. Base: ${storedDistanceMeters.toFixed(2)}m | Topo: ${currentPitchDegrees.toFixed(1)}°`;
            }
        }

        // --- 6. MÁQUINA DE ESTADOS DO BOTÃO DE ALTURA ---
        function handleAction() {
            if (heightStep === 1) {
                const d = getHorizontalDistance();
                if (d === null) {
                    alert("Apunte para o chão para fixar a base corretamente.");
                    return;
                }
                storedDistanceMeters = d;
                basePitchDegrees = currentPitchDegrees; // Grava o ângulo do chão
                heightStep = 2;
                
                actionBtn.innerText = "2º Passo: Medir Topo (Resetar)";
                actionBtn.style.backgroundColor = "#ffc107";
                actionBtn.style.color = "#000";
                resultDisplay.innerText = "Mire no TOPO do objeto";
                subInfo.innerText = `Base salva (${d.toFixed(2)}m). Erga o celular para medir!`;
            } else {
                resetHeightState();
            }
        }

        userHeightInput.addEventListener('input', updateCalculations);
    </script>
</body>
</html>
