<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual - Distância e Altura</title>
    <style>
        /* Reset e layout ocupar 100% da tela */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Vídeo da câmera traseira */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Mirante central (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff00;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* Painel principal de controle */
        #controls-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            font-size: 15px;
            z-index: 10;
            text-align: center;
            width: 85%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Seletor de Modo (Abas) */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .mode-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .mode-btn.active {
            background: #007bff;
            border-color: #007bff;
            font-weight: bold;
        }

        /* Estilização dos resultados */
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            margin: 5px 0;
        }

        .input-group {
            margin-top: 8px;
            font-size: 13px;
        }

        .input-group input {
            width: 55px;
            padding: 3px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* Botão de ação (Capturar topo/base) */
        #action-btn {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            display: none;
        }

        /* Botão de início */
        #permission-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 30px;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <div id="controls-panel">
        <!-- Seletor de Modo -->
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-dist" onclick="switchMode('dist')">Distância</button>
            <button class="mode-btn" id="btn-mode-height" onclick="switchMode('height')">Altura</button>
        </div>

        <div id="result-display" class="result-title">Distância: -- m</div>
        <div id="sub-info" style="font-size: 12px; color: #aaa;">Inclinação: --°</div>
        
        <div class="input-group">
            <label for="user-height">Sua altura do celular (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.05" min="0.5" max="2.5">
        </div>

        <button id="action-btn" onclick="handleAction()">1º Passo: Fixar Base</button>
    </div>

    <button id="permission-btn">Ativar Sensores e Câmera</button>

    <script>
        // --- DOCUMENTAÇÃO DAS VARIÁVEIS GLOBAIS ---
        const videoElement = document.getElementById('camera-video');
        const resultDisplay = document.getElementById('result-display');
        const subInfo = document.getElementById('sub-info');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');
        const actionBtn = document.getElementById('action-btn');

        let currentMode = 'dist'; // 'dist' ou 'height'
        let heightStep = 1;       // 1: Capturar Base, 2: Capturar Topo
        let currentPitchDegrees = 0;
        
        // Memória para o cálculo da altura
        let storedDistanceMeters = 0;

        // --- PASSO 1: ATIVAÇÃO DE SENSORES E CÂMERA ---
        permissionBtn.addEventListener('click', async () => {
            await startCamera();
            await requestOrientationPermission();
            permissionBtn.style.display = 'none';
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
            } catch (err) {
                alert("Erro ao acessar a câmera: " + err.message);
            }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } catch (e) { console.error(e); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // --- PASSO 2: LEITURA DO GIROSCÓPIO ---
        function handleOrientation(event) {
            if (event.beta !== null) {
                currentPitchDegrees = event.beta;
                updateCalculations();
            }
        }

        // --- PASSO 3: GERENCIAMENTO DE MODOS E CÁLCULOS ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-dist').classList.toggle('active', mode === 'dist');
            document.getElementById('btn-mode-height').classList.toggle('active', mode === 'height');
            
            if (mode === 'dist') {
                actionBtn.style.display = 'none';
                updateCalculations();
            } else {
                heightStep = 1;
                actionBtn.style.display = 'inline-block';
                actionBtn.innerText = "1º Passo: Fixar Base (Chão)";
                resultDisplay.innerText = "Mire na BASE do objeto";
                subInfo.innerText = "Aperte o botão para fixar a distância";
            }
        }

        function getHorizontalDistance() {
            const h = parseFloat(userHeightInput.value) || 1.50;
            let angleFromHorizontal = 90 - currentPitchDegrees;

            if (angleFromHorizontal <= 1 || angleFromHorizontal >= 89) return null;

            const angleRadians = angleFromHorizontal * (Math.PI / 180);
            return h / Math.tan(angleRadians);
        }

        function updateCalculations() {
            if (currentMode === 'dist') {
                const d = getHorizontalDistance();
                if (d === null) {
                    resultDisplay.innerText = "Distância: --";
                    subInfo.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}°`;
                } else {
                    resultDisplay.innerText = `Distância: ${d.toFixed(2)} m`;
                    subInfo.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}° | ${(d * 100).toFixed(0)} cm`;
                }
            } else if (currentMode === 'height' && heightStep === 2) {
                // Cálculo da Altura durante a Etapa 2 (Apontando para o topo)
                const eyeHeight = parseFloat(userHeightInput.value) || 1.50;
                
                // Ângulo de elevação acima ou abaixo da linha dos olhos (horizonte = 90° pitch)
                let elevationAngleDegrees = 90 - currentPitchDegrees;
                let elevationRadians = elevationAngleDegrees * (Math.PI / 180);
                
                // Fórmula da Altura: H = h_olhos + (distância_horizontal * tan(ângulo_elevação))
                let calculatedObjectHeight = eyeHeight - (storedDistanceMeters * Math.tan(elevationRadians));

                if (calculatedObjectHeight < 0) calculatedObjectHeight = 0;

                resultDisplay.innerText = `Altura: ${calculatedObjectHeight.toFixed(2)} m`;
                subInfo.innerText = `Dist. Base: ${storedDistanceMeters.toFixed(2)}m | Topo: ${currentPitchDegrees.toFixed(1)}°`;
            }
        }

        // --- PASSO 4: FLUXO DE MEDIÇÃO DA ALTURA ---
        function handleAction() {
            if (heightStep === 1) {
                // Fixa a base
                const d = getHorizontalDistance();
                if (d === null) {
                    alert("Apunte para o chão para fixar a base corretamente.");
                    return;
                }
                storedDistanceMeters = d;
                heightStep = 2;
                actionBtn.innerText = "2º Passo: Medir Topo";
                actionBtn.style.backgroundColor = "#ffc107";
                actionBtn.style.color = "#000";
                resultDisplay.innerText = "Mire no TOPO do objeto";
                subInfo.innerText = `Base salva: ${d.toFixed(2)}m. Agora incline para cima!`;
            } else {
                // Reseta para nova medição de altura
                heightStep = 1;
                actionBtn.innerText = "1º Passo: Fixar Base (Chão)";
                actionBtn.style.backgroundColor = "#28a745";
                actionBtn.style.color = "#fff";
                updateCalculations();
            }
        }

        userHeightInput.addEventListener('input', updateCalculations);
    </script>
</body>
</html>
