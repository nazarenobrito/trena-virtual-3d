<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual - Modo Híbrido Completo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Vídeo da câmera padrão (Fallback para aparelhos sem WebXR) */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        /* Painel superior de mensagens */
        #info-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            text-align: center;
            width: 80%;
        }

        /* Botão principal de ação */
        #start-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
        }
    </style>

    <!-- Biblioteca Three.js para renderização 3D e AR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="info-panel">Verificando suporte do dispositivo...</div>
    <video id="camera-video" autoplay playsinline></video>
    <button id="start-button">Aguarde...</button>

    <script>
        // --- 1. REFERÊNCIAS ELEMENTOS DA TELA ---
        const infoPanel = document.getElementById('info-panel');
        const startButton = document.getElementById('start-button');
        const videoElement = document.getElementById('camera-video');

        // Variáveis globais do Three.js / WebXR
        let camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // --- 2. VERIFICAÇÃO DE SUPORTE AO WEBXR ---
        async function checkSupport() {
            if (navigator.xr) {
                const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
                if (supported) {
                    infoPanel.innerText = "Dispositivo suporta WebXR AR Nativo!";
                    startButton.innerText = "Iniciar AR (WebXR)";
                    startButton.onclick = startWebXR;
                    return;
                }
            }
            // Fallback se não suportar WebXR
            infoPanel.innerText = "Modo de compatibilidade: Câmera Nativa";
            startButton.innerText = "Abrir Câmera do Celular";
            startButton.onclick = startFallbackCamera;
        }

        // --- 3. CAMINHO A: INICIALIZAÇÃO DO WEBXR (3D NATIVO) ---
        async function startWebXR() {
            try {
                // Solicita a sessão de AR ao navegador
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test']
                });

                startButton.style.display = 'none';
                infoPanel.innerText = "Aponte para o chão até aparecer o círculo verde";

                // Prepara a cena 3D do Three.js
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

                // Configura o renderizador WebGL
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.xr.enabled = true;
                document.body.appendChild(renderer.domElement);

                // Adiciona o retículo verde (mira no chão)
                reticle = new THREE.Mesh(
                    new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2),
                    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
                );
                reticle.matrixAutoUpdate = false;
                reticle.visible = false;
                scene.add(reticle);

                // Associa a sessão AR ao Three.js
                renderer.xr.setSession(session);

                // Loop contínuo de renderização
                renderer.setAnimationLoop(renderWebXR);

            } catch (error) {
                alert("Não foi possível iniciar o WebXR: " + error.message);
                // Em caso de falha, alterna para a câmera padrão
                startFallbackCamera();
            }
        }

        // Loop de animação do WebXR
        function renderWebXR(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }

        // --- 4. CAMINHO B: CÂMERA PADRÃO (FALLBACK) ---
        async function startFallbackCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
                videoElement.style.display = 'block';
                startButton.style.display = 'none';
                infoPanel.innerText = "Câmera ativa! (Modo de Compatibilidade)";
            } catch (err) {
                alert("Erro ao acessar a câmera: " + err.message);
            }
        }

        // Executa a verificação assim que a página carrega
        checkSupport();
    </script>
</body>
</html>
