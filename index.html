<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual - Giroscópio e Trigonometria</title>
    <style>
        /* Estilização para ocupar 100% da tela do smartphone */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Elemento de vídeo para a câmera traseira */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Mirante central (Crosshair) para apontar para a base do objeto no chão */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #00ff00;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* Painel superior com resultados e controles de altura */
        #controls-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            z-index: 10;
            text-align: center;
            width: 85%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Estilização da caixa de texto da altura */
        .input-group {
            margin-top: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 60px;
            padding: 4px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        /* Botão para solicitar permissão de sensores em navegadores restritos */
        #permission-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 30px;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Elementos visuais principais -->
    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <!-- Painel de informação e configuração de altura -->
    <div id="controls-panel">
        <div id="distance-display">Distância: -- m</div>
        <div id="angle-display" style="font-size: 12px; color: #aaa; margin-top: 4px;">Inclinação: --°</div>
        
        <div class="input-group">
            <label for="user-height">Altura do celular (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.05" min="0.5" max="2.5">
        </div>
    </div>

    <button id="permission-btn">Ativar Sensores e Câmera</button>

    <script>
        // --- DOCUMENTAÇÃO DAS VARIÁVEIS GLOBAIS ---
        const videoElement = document.getElementById('camera-video');
        const distanceDisplay = document.getElementById('distance-display');
        const angleDisplay = document.getElementById('angle-display');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');

        let currentPitchDegrees = 0;

        // --- PASSO 1: INICIALIZAÇÃO DA CÂMERA E DOS SENSORES ---
        permissionBtn.addEventListener('click', async () => {
            await startCamera();
            await requestOrientationPermission();
            permissionBtn.style.display = 'none';
        });

        // Função para abrir a câmera traseira do celular
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                videoElement.srcObject = stream;
            } catch (err) {
                alert("Erro ao acessar a câmera traseira: " + err.message);
            }
        }

        // Função para solicitar acesso ao Giroscópio/Acelerômetro
        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Necessário para navegadores iOS Safari
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    } else {
                        alert("Permissão para giroscópio foi negada.");
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                // Padrão para Android / Chrome
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // --- PASSO 2: CAPTURA DO ÂNGULO DE INCLINAÇÃO (PITCH) ---
        function handleOrientation(event) {
            // event.beta representa a inclinação frente/trás em graus (-180 a 180)
            let beta = event.beta; 

            if (beta !== null) {
                currentPitchDegrees = beta;
                calculateDistance();
            }
        }

        // --- PASSO 3: LÓGICA MATEMÁTICA E CÁLCULO DA DISTÂNCIA ---
        function calculateDistance() {
            // Obtém a altura configurada pelo usuário (em metros)
            const height = parseFloat(userHeightInput.value) || 1.50;

            // Ajusta o ângulo considerando que 90° é o celular em pé na vertical.
            // Quanto mais apontamos para o chão, menor é o ângulo com a horizontal.
            let angleFromHorizontal = 90 - currentPitchDegrees;

            // Limitações de segurança para evitar divisão por zero ou ângulos negativos (apontando para cima)
            if (angleFromHorizontal <= 1) {
                distanceDisplay.innerText = "Distância: Apunte para o chão";
                angleDisplay.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}°`;
                return;
            }

            if (angleFromHorizontal >= 89) {
                distanceDisplay.innerText = "Distância: Muito próximo";
                angleDisplay.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}°`;
                return;
            }

            // Converter graus para radianos para usar na função Math.tan() do JS
            const angleRadians = angleFromHorizontal * (Math.PI / 180);

            // Fórmula Trigonométrica: Distância = Altura / tan(ângulo_com_a_horizontal)
            const distanceMeters = height / Math.tan(angleRadians);

            // Atualiza a interface gráfica
            angleDisplay.innerText = `Inclinação: ${currentPitchDegrees.toFixed(1)}°`;
            distanceDisplay.innerText = `Distância: ${distanceMeters.toFixed(2)} m (${(distanceMeters * 100).toFixed(0)} cm)`;
        }

        // Recalcular quando o usuário alterar a altura no input
        userHeightInput.addEventListener('input', calculateDistance);
    </script>
</body>
</html>
