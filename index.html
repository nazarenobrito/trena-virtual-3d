<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual - Modo Híbrido</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Video da câmera padrão em tela cheia (Fallback) */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            text-align: center;
            width: 80%;
        }

        #start-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info-panel">Verificando suporte do dispositivo...</div>
    <video id="camera-video" autoplay playsinline></video>
    <button id="start-button">Iniciar Câmera</button>

    <script>
        const infoPanel = document.getElementById('info-panel');
        const startButton = document.getElementById('start-button');
        const videoElement = document.getElementById('camera-video');

        // Passo 1: Verificar se o navegador suporta WebXR AR
        async function checkSupport() {
            if (navigator.xr) {
                const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
                if (supported) {
                    infoPanel.innerText = "Dispositivo suporta WebXR AR Nativo!";
                    startButton.innerText = "Iniciar AR (WebXR)";
                    startButton.onclick = startWebXR;
                    return;
                }
            }
            // Caso não suporte WebXR (ex: Moto G22 sem ARCore)
            infoPanel.innerText = "Modo de compatibilidade: Câmera Nativa";
            startButton.innerText = "Abrir Câmera do Celular";
            startButton.onclick = startFallbackCamera;
        }

        // Passo 2A: Iniciar Câmera Padrão (Para aparelhos sem ARCore)
        async function startFallbackCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } // Usa a câmera traseira
                });
                videoElement.srcObject = stream;
                videoElement.style.display = 'block';
                startButton.style.display = 'none';
                infoPanel.innerText = "Câmera ativa! Toque na tela para marcar.";
            } catch (err) {
                alert("Erro ao acessar a câmera: " + err.message);
            }
        }

        // Passo 2B: Iniciar WebXR (Para aparelhos compatíveis)
        function startWebXR() {
            alert("Iniciando modo WebXR nativo...");
            // Lógica do Three.js WebXR anterior
        }

        checkSupport();
    </script>
</body>
</html>
