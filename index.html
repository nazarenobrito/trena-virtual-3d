<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual Pro - Altura Dinâmica Contínua</title>
    <style>
        /* ESTILOS BASE */
        body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; }
        #camera-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }

        /* MIRA INTELIGENTE */
        :root { --crosshair-color: #ff4d4d; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%); border: 2.5px solid var(--crosshair-color); border-radius: 50%; z-index: 5; pointer-events: none; box-shadow: 0 0 8px rgba(0,0,0,0.6); transition: border-color 0.3s ease; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: var(--crosshair-color); transform: translate(-50%, -50%); border-radius: 50%; }

        /* VISUALIZADOR 2D SVG */
        #visualizer-container { position: absolute; top: 20px; left: 20px; background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(8px); border-radius: 12px; padding: 10px; z-index: 15; border: 1px solid rgba(255, 255, 255, 0.1); opacity: 0.3; transition: opacity 0.3s ease; }
        #visualizer-container span { display: block; color: #aaa; font-size: 10px; text-align: center; margin-bottom: 5px; font-weight: bold; }

        /* PAINEL PRINCIPAL */
        #controls-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(12px); color: #ffffff; padding: 12px 16px; border-radius: 16px; font-size: 13px; z-index: 10; text-align: center; width: 90%; max-height: 55vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.8); border: 1px solid rgba(255, 255, 255, 0.15); }
        .mode-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .mode-btn { background: rgba(255,255,255,0.1); color: #ccc; border: none; padding: 6px 14px; border-radius: 12px; cursor: pointer; font-size: 13px; }
        .mode-btn.active { background: #007aff; color: #fff; font-weight: bold; }
        .result-title { font-size: 24px; font-weight: 900; color: #fff; margin: 4px 0; }
        
        /* CONTROLES DE ALTURA DINÂMICA */
        .input-group { margin-top: 8px; font-size: 12px; color: #ddd; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .input-group input { width: 55px; padding: 4px; text-align: center; border-radius: 6px; border: 1px solid #555; background: rgba(0,0,0,0.5); color: #fff; font-weight: bold; }
        
        .dynamic-btn { background: #8e8e93; color: white; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .dynamic-btn.active { background: #ff3b30; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .actions-grid { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .btn-action { padding: 8px 12px; font-size: 12px; font-weight: bold; color: #fff; border: none; border-radius: 12px; cursor: pointer; }
        #calibrate-btn { background-color: #5e5ce6; }
        #action-btn { background-color: #34c759; display: none; }
        #save-btn { background-color: #ff9f0a; }

        /* HISTÓRICO */
        #history-section { display: none; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; text-align: left; }
        #history-list { list-style: none; padding: 0; margin: 6px 0; max-height: 120px; overflow-y: auto; }
        #history-list li { background: rgba(255, 255, 255, 0.08); padding: 6px 10px; border-radius: 8px; margin-bottom: 4px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #ff9f0a; }

        #permission-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 32px; font-size: 16px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #007aff, #5e5ce6); border: none; border-radius: 30px; z-index: 20; }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <div id="visualizer-container">
        <span>Visão Lateral</span>
        <svg id="triangle-svg" width="130" height="130">
            <polygon id="triangle-polygon" points="10,10 10,110 110,110" fill="rgba(50, 215, 75, 0.2)" stroke="#32d74b" stroke-width="2"/>
            <text id="text-h" x="12" y="60" fill="#fff" font-size="11" transform="rotate(-90 12,60)">1.50m</text>
            <text id="text-d" x="60" y="125" fill="#fff" font-size="11" text-anchor="middle">--m</text>
            <text id="text-ang" x="25" y="25" fill="#ff9f0a" font-size="12" font-weight="bold">--°</text>
        </svg>
    </div>

    <div id="controls-panel">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-dist" onclick="switchMode('dist')">Distância</button>
            <button class="mode-btn" id="btn-mode-height" onclick="switchMode('height')">Altura Vertical</button>
        </div>

        <div id="result-display" class="result-title">Calibre o Nível</div>
        <div id="sub-info" style="font-size: 11px; color: #aaa;">Olhe para frente e calibre</div>
        <div id="error-display" style="color: #ff453a; font-size: 11px; margin-top: 2px;"></div>
        
        <div class="input-group">
            <label for="user-height">Altura Calc (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.01" min="0.0" max="5.0">
            <!-- BOTÕES DA ALTURA DINÂMICA -->
            <button id="dynamic-toggle-btn" class="dynamic-btn" onclick="toggleDynamicHeight()">Rastreio: OFF</button>
            <button id="zero-floor-btn" class="dynamic-btn" style="background:#34c759; display:none;" onclick="zeroFloor()">📍 Zerar Chão</button>
        </div>

        <div style="margin-top: 6px; font-size: 12px; color: #ffcc00;">
            Câmera física a: <strong id="real-height-val">1.32</strong><strong>m</strong>
        </div>

        <div class="actions-grid">
            <button class="btn-action" id="calibrate-btn" onclick="calibrateHorizon()">🎯 Calibrar Nível</button>
            <button class="btn-action" id="action-btn" onclick="handleAction()">📍 Fixar Base</button>
            <button class="btn-action" id="save-btn" onclick="saveCurrentMeasurement()">💾 Salvar Medida</button>
        </div>

        <div id="history-section">
            <strong style="font-size: 12px; color: #ddd;">Medições Salvas</strong>
            <ul id="history-list"></ul>
            <button class="btn-action" style="background: #ff3b30; font-size: 10px; padding: 4px 8px;" onclick="clearHistory()">Apagar Tudo</button>
        </div>
    </div>

    <button id="permission-btn">Ativar Trena Virtual</button>

    <script>
        const videoElement = document.getElementById('camera-video');
        const resultDisplay = document.getElementById('result-display');
        const subInfo = document.getElementById('sub-info');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');
        const dynamicToggleBtn = document.getElementById('dynamic-toggle-btn');
        const zeroFloorBtn = document.getElementById('zero-floor-btn');
        const rootStyles = document.documentElement;

        const OFFSET_FISICO = 0.18; // Desvio da lente validado
        let currentMode = 'dist', heightStep = 1;
        let rawPitch = 0, smoothedPitch = null, horizonBeta = 90;
        let storedDistanceMeters = 0;
        let lastCalculatedValue = 0;

        // VARIÁVEIS DA ALTURA DINÂMICA CONTÍNUA
        let isDynamicHeightOn = false;
        let currentVelocity = 0;
        let currentDisplacement = parseFloat(userHeightInput.value) - OFFSET_FISICO; // Inicia com o valor do input
        let lastTime = 0;
        let accelNoiseGate = 0.35; // Barreira contra pequenos tremores da mão

        function updatePhysicalInstruction() {
            const calcHeight = parseFloat(userHeightInput.value) || 1.50;
            let realHeight = calcHeight - OFFSET_FISICO;
            document.getElementById('real-height-val').innerText = (realHeight > 0 ? realHeight : 0).toFixed(2);
        }

        const savedCameraHeight = localStorage.getItem('trena_camera_height');
        if (savedCameraHeight) userHeightInput.value = savedCameraHeight; 
        updatePhysicalInstruction();

        // Se alterar manualmente, guarda
        userHeightInput.addEventListener('input', () => {
            localStorage.setItem('trena_camera_height', userHeightInput.value);
            currentDisplacement = parseFloat(userHeightInput.value) - OFFSET_FISICO;
            updatePhysicalInstruction(); updateCalculations();
        });

        permissionBtn.addEventListener('click', async () => {
            if (navigator.vibrate) navigator.vibrate(40);
            const camOk = await startCamera();
            const sensorOk = await requestOrientationPermission();
            if (camOk && sensorOk) {
                permissionBtn.style.display = 'none';
            }
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = stream; return true;
            } catch (err) { return false; }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                    window.addEventListener('deviceorientation', handleOrientation);
                    await DeviceMotionEvent.requestPermission();
                    window.addEventListener('devicemotion', handleMotion);
                    return true;
                } catch (e) { return false; }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
                return true;
            }
        }

        // --- LÓGICA DO RASTREIO CONTÍNUO ---
        function toggleDynamicHeight() {
            if (navigator.vibrate) navigator.vibrate(40);
            isDynamicHeightOn = !isDynamicHeightOn;
            
            if (isDynamicHeightOn) {
                dynamicToggleBtn.innerText = "Rastreio: ON";
                dynamicToggleBtn.classList.add('active');
                zeroFloorBtn.style.display = 'inline-block';
                lastTime = performance.now();
                currentVelocity = 0;
                // Sincroniza a posição atual com a caixa de texto
                currentDisplacement = parseFloat(userHeightInput.value) - OFFSET_FISICO;
                if(currentDisplacement < 0) currentDisplacement = 0;
            } else {
                dynamicToggleBtn.innerText = "Rastreio: OFF";
                dynamicToggleBtn.classList.remove('active');
                zeroFloorBtn.style.display = 'none';
            }
        }

        function zeroFloor() {
            if (navigator.vibrate) navigator.vibrate(40);
            currentDisplacement = 0; // O telemóvel está no chão (Altura Real = 0)
            currentVelocity = 0;
            updateUIFromDynamicHeight();
        }

        function handleMotion(event) {
            if (!isDynamicHeightOn) return;

            const accX = event.acceleration.x || 0;
            const accY = event.acceleration.y || 0;
            const accZ = event.acceleration.z || 0;
            
            let magnitude = Math.sqrt(accX*accX + accY*accY + accZ*accZ);
            let linearAcc = (accY > 0 || accZ > 0) ? magnitude : -magnitude;

            // Filtro de Fricção (Leaky Integrator): Se parou de acelerar, zera a velocidade rapidamente para não flutuar infinito
            if (Math.abs(linearAcc) < accelNoiseGate) {
                linearAcc = 0;
                currentVelocity *= 0.85; // Fricção forte
                if(Math.abs(currentVelocity) < 0.05) currentVelocity = 0;
            }

            const currentTime = performance.now();
            if (lastTime !== 0) {
                const dt = (currentTime - lastTime) / 1000; 

                currentVelocity += linearAcc * dt;
                currentDisplacement += currentVelocity * dt;

                // Não deixa a altura ficar negativa (abaixo do chão)
                if(currentDisplacement < 0) {
                    currentDisplacement = 0;
                    currentVelocity = 0;
                }

                updateUIFromDynamicHeight();
            }
            lastTime = currentTime;
        }

        // Atualiza o input e o triângulo em tempo real!
        function updateUIFromDynamicHeight() {
            let alturaMatematicaCalculada = currentDisplacement + OFFSET_FISICO;
            
            // Atualiza o Input Visual
            userHeightInput.value = alturaMatematicaCalculada.toFixed(2);
            
            // Atualiza os textos
            updatePhysicalInstruction();
            
            // Atualiza toda a matemática e animação do ecrã instantaneamente
            updateCalculations();
        }
        // --- FIM DA LÓGICA DE RASTREIO CONTÍNUO ---

        function handleOrientation(event) {
            if (event.beta !== null) {
                rawPitch = event.beta;
                if (smoothedPitch === null) smoothedPitch = rawPitch;
                else smoothedPitch = smoothedPitch + 0.25 * (rawPitch - smoothedPitch);
                updateCalculations(); // Sempre que inclinar a mão, recalcula!
            }
        }

        function calibrateHorizon() {
            if (navigator.vibrate) navigator.vibrate(40);
            horizonBeta = rawPitch; updateCalculations();
        }

        function getBaseDistance() {
            const h = parseFloat(userHeightInput.value); // Pega a altura que agora é dinâmica!
            const elevation = smoothedPitch - horizonBeta;
            if (!Number.isFinite(h) || h <= 0 || elevation >= -1.5) return null; 
            return -h / Math.tan(elevation * (Math.PI / 180));
        }

        function drawTriangle(distance, cameraHeight, angle) {
            const vis = document.getElementById('visualizer-container');
            if (!distance || distance <= 0) { vis.style.opacity = '0.3'; return; }
            vis.style.opacity = '1';
            let drawW, drawH;
            if (distance > cameraHeight) { drawW = 100; drawH = 100 * (cameraHeight / distance); } 
            else { drawH = 100; drawW = 100 * (distance / cameraHeight); }

            document.getElementById('triangle-polygon').setAttribute('points', `20,15 20,${15 + drawH} ${20 + drawW},${15 + drawH}`);
            
            const textH = document.getElementById('text-h'); textH.textContent = cameraHeight.toFixed(2) + 'm';
            textH.setAttribute('transform', `rotate(-90 12,${15 + drawH / 2})`); textH.setAttribute('y', 15 + drawH / 2);
            
            const textD = document.getElementById('text-d'); textD.textContent = distance.toFixed(2) + 'm';
            textD.setAttribute('x', 20 + drawW / 2); textD.setAttribute('y', 15 + drawH + 12);
        }

        function updateCalculations() {
            const elevation = smoothedPitch - horizonBeta;
            const hCam = parseFloat(userHeightInput.value) || 1.50; 
            
            if (currentMode === 'dist') {
                const d = getBaseDistance();
                if (d === null) {
                    resultDisplay.innerText = "Aponte p/ Baixo"; drawTriangle(0, hCam, 0);
                    rootStyles.style.setProperty('--crosshair-color', '#ff453a');
                } else {
                    lastCalculatedValue = d;
                    resultDisplay.innerText = `${d.toFixed(2)} m`;
                    drawTriangle(d, hCam, elevation);
                    rootStyles.style.setProperty('--crosshair-color', '#32d74b');
                }
            }
        }

        function switchMode(mode) {
            if (navigator.vibrate) navigator.vibrate(40);
            currentMode = mode;
            document.getElementById('btn-mode-dist').classList.toggle('active', mode === 'dist');
            document.getElementById('btn-mode-height').classList.toggle('active', mode === 'height');
            if (mode === 'dist') { document.getElementById('action-btn').style.display = 'none'; updateCalculations(); }
            else { 
                document.getElementById('action-btn').style.display = 'inline-block'; 
                document.getElementById('action-btn').innerText = "📍 Fixar Base"; 
            }
        }

        function saveCurrentMeasurement() {
            if (navigator.vibrate) navigator.vibrate(40);
            // Lógica simples de salvar
            let hist = JSON.parse(localStorage.getItem('trena_history') || '[]');
            hist.push({ id: Date.now(), label: "Medida", value: lastCalculatedValue.toFixed(2) });
            localStorage.setItem('trena_history', JSON.stringify(hist));
            alert(`Medida de ${lastCalculatedValue.toFixed(2)}m salva!`);
        }
    </script>
</body>
</html>
