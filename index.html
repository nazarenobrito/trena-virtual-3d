<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trena Virtual Pro</title>
    <style>
        /* 1. ESTILOS BASE E LAYOUT */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* 2. MIRA INTELIGENTE (CROSSHAIR) */
        :root {
            --crosshair-color: #ff4d4d; /* Inicia vermelho até calibrar/mirar certo */
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            border: 2.5px solid var(--crosshair-color);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
            transition: border-color 0.3s ease;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--crosshair-color);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        /* 3. DESIGN PREMIUM DO PAINEL (Glassmorphism) */
        #controls-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(12px); /* Efeito vidro fosco */
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 13px;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-height: 45vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Abas de Modo */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .mode-btn {
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #007aff;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.5);
        }

        /* Tipografia de Resultados */
        .result-title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin: 4px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .input-group {
            margin-top: 8px;
            font-size: 12px;
            color: #ddd;
        }

        .input-group input {
            width: 50px;
            padding: 4px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #555;
            background: rgba(0,0,0,0.5);
            color: #fff;
        }

        /* Botões de Ação Modernos */
        .actions-grid {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-action {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }
        
        .btn-action:active { transform: scale(0.95); } /* Efeito de clique */

        #calibrate-btn { background-color: #5e5ce6; }
        #action-btn { background-color: #34c759; display: none; }
        #save-btn { background-color: #ff9f0a; }
        #toggle-history-btn { background-color: #444; }

        /* Histórico Estilizado */
        #history-section {
            display: none;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 10px;
            text-align: left;
        }

        #history-list {
            list-style: none;
            padding: 0;
            margin: 6px 0;
            max-height: 120px;
            overflow-y: auto;
        }

        #history-list li {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #ff9f0a;
        }

        /* Botão Inicial */
        #permission-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #007aff, #5e5ce6);
            border: none;
            border-radius: 30px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }

    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline></video>
    <div id="crosshair"></div>

    <div id="controls-panel">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-dist" onclick="switchMode('dist')">Distância</button>
            <button class="mode-btn" id="btn-mode-height" onclick="switchMode('height')">Altura</button>
        </div>

        <div id="result-display" class="result-title">Calibre o sensor</div>
        <div id="sub-info" style="font-size: 11px; color: #aaa;">Aguardando...</div>
        <div id="error-display" style="color: #ff453a; font-size: 11px; margin-top: 2px;"></div>
        
        <div class="input-group">
            <label for="user-height">Altura do Celular (m): </label>
            <input type="number" id="user-height" value="1.50" step="0.05" min="0.5" max="2.5">
        </div>

        <div class="actions-grid">
            <button class="btn-action" id="calibrate-btn" onclick="calibrateHorizon()">🎯 Calibrar</button>
            <button class="btn-action" id="action-btn" onclick="handleAction()">📍 Fixar Base</button>
            <button class="btn-action" id="save-btn" onclick="saveCurrentMeasurement()">💾 Salvar</button>
            <button class="btn-action" id="toggle-history-btn" onclick="toggleHistory()">📋 Histórico</button>
        </div>

        <div id="history-section">
            <strong style="font-size: 12px; color: #ddd;">Medições Salvas</strong>
            <ul id="history-list"></ul>
            <button class="btn-action" style="background: #ff3b30; font-size: 10px; padding: 4px 8px;" onclick="clearHistory()">Apagar Tudo</button>
        </div>
    </div>

    <button id="permission-btn">Ativar Trena Virtual Pro</button>

    <script>
        // --- 1. REFERÊNCIAS VISUAIS ---
        const videoElement = document.getElementById('camera-video');
        const resultDisplay = document.getElementById('result-display');
        const subInfo = document.getElementById('sub-info');
        const errorDisplay = document.getElementById('error-display');
        const userHeightInput = document.getElementById('user-height');
        const permissionBtn = document.getElementById('permission-btn');
        const actionBtn = document.getElementById('action-btn');
        const calibrateBtn = document.getElementById('calibrate-btn');
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');
        const rootStyles = document.documentElement;

        // --- 2. VARIÁVEIS DE ESTADO E SUAVIZAÇÃO (FILTRO) ---
        let currentMode = 'dist';
        let heightStep = 1;
        
        // Variáveis do Filtro Passa-Baixa
        let smoothedPitch = null;
        const smoothingFactor = 0.15; // 0.15 garante fluidez sem muito atraso
        
        let lastCalculatedValue = 0;
        let horizonBeta = 90;
        let isCalibrated = false;
        let storedDistanceMeters = 0;
        let savedMeasurements = JSON.parse(localStorage.getItem('trena_history') || '[]');

        // --- 3. FEEDBACK TÁTIL ---
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(40); // Vibra por 40ms
            }
        }

        // --- 4. INICIALIZAÇÃO ---
        permissionBtn.addEventListener('click', async () => {
            triggerHaptic();
            errorDisplay.innerText = "";
            const camOk = await startCamera();
            const sensorOk = await requestOrientationPermission();
            if (camOk && sensorOk) {
                permissionBtn.style.display = 'none';
                renderHistory();
            }
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = stream;
                return true;
            } catch (err) {
                errorDisplay.innerText = "Erro na câmera: " + err.message;
                return false;
            }
        }

        async function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        return true;
                    }
                    return false;
                } catch (e) { return false; }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                return true;
            }
        }

        // --- 5. FILTRO MATEMÁTICO DO GIROSCÓPIO ---
        function handleOrientation(event) {
            if (event.beta !== null) {
                let rawPitch = event.beta;
                
                // Aplica o Filtro Passa-Baixa (Exponential Moving Average)
                if (smoothedPitch === null) {
                    smoothedPitch = rawPitch;
                } else {
                    smoothedPitch = smoothedPitch + smoothingFactor * (rawPitch - smoothedPitch);
                }
                
                updateCalculations();
            }
        }

        function getElevationDegrees() {
            return smoothedPitch - horizonBeta;
        }

        function calibrateHorizon() {
            triggerHaptic();
            horizonBeta = smoothedPitch;
            isCalibrated = true;
            calibrateBtn.style.backgroundColor = "#34c759";
            calibrateBtn.innerText = "✓ Calibrado";
            updateCalculations();
        }

        // --- 6. CÁLCULO E COR DA MIRA ---
        function getBaseDistance() {
            const h = parseFloat(userHeightInput.value);
            const elevation = getElevationDegrees();
            if (!Number.isFinite(h) || h <= 0 || elevation >= -2) return null;
            return -h / Math.tan(elevation * (Math.PI / 180));
        }

        function getObjectHeight(distance) {
            const h = parseFloat(userHeightInput.value);
            const elevation = getElevationDegrees();
            if (!Number.isFinite(h) || h <= 0) return 0;
            return h + (distance * Math.tan(elevation * (Math.PI / 180)));
        }

        function setCrosshairColor(isValid) {
            if (isValid) {
                rootStyles.style.setProperty('--crosshair-color', '#32d74b'); // Verde iPhone
            } else {
                rootStyles.style.setProperty('--crosshair-color', '#ff453a'); // Vermelho iPhone
            }
        }

        function updateCalculations() {
            const elevation = getElevationDegrees();
            const subText = `Elevação: ${elevation.toFixed(1)}°`;

            if (currentMode === 'dist') {
                const d = getBaseDistance();
                if (d === null) {
                    resultDisplay.innerText = isCalibrated ? "Aponte p/ o chão" : "Calibre o Sensor";
                    subInfo.innerText = subText;
                    lastCalculatedValue = 0;
                    setCrosshairColor(false);
                } else {
                    lastCalculatedValue = d;
                    resultDisplay.innerText = `${d.toFixed(2)} m`;
                    resultDisplay.style.color = "#32d74b";
                    subInfo.innerText = `${subText} | ${(d * 100).toFixed(0)} cm`;
                    setCrosshairColor(true);
                }
            } else if (currentMode === 'height' && heightStep === 2) {
                const totalHeight = getObjectHeight(storedDistanceMeters);
                lastCalculatedValue = totalHeight;
                resultDisplay.innerText = `${totalHeight.toFixed(2)} m`;
                resultDisplay.style.color = "#0a84ff"; // Azul
                subInfo.innerText = `Base: ${storedDistanceMeters.toFixed(2)}m | ${subText}`;
                setCrosshairColor(true);
            }
        }

        // --- 7. HISTÓRICO E MÁQUINA DE ESTADOS ---
        function toggleHistory() {
            triggerHaptic();
            const isHidden = historySection.style.display === 'none' || historySection.style.display === '';
            historySection.style.display = isHidden ? 'block' : 'none';
        }

        function saveCurrentMeasurement() {
            triggerHaptic();
            if (lastCalculatedValue <= 0) {
                alert("Mire corretamente antes de salvar.");
                return;
            }
            const label = prompt("Nome da medição:", currentMode === 'dist' ? "Distância" : "Altura");
            if (label === null) return;

            savedMeasurements.push({
                id: Date.now(),
                label: label || (currentMode === 'dist' ? "Distância" : "Altura"),
                type: currentMode === 'dist' ? "Distância" : "Altura",
                value: lastCalculatedValue.toFixed(2)
            });
            localStorage.setItem('trena_history', JSON.stringify(savedMeasurements));
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = "";
            if (savedMeasurements.length === 0) {
                historyList.innerHTML = "<li style='color: #888;'>Nenhum registro.</li>";
                return;
            }
            savedMeasurements.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span><strong>${item.label}:</strong> ${item.value} m</span>
                                <button onclick="deleteHistoryItem(${item.id})" style="background:none; border:none; color:#ff453a; cursor:pointer; font-size:14px;">✕</button>`;
                historyList.appendChild(li);
            });
        }

        function deleteHistoryItem(id) {
            triggerHaptic();
            savedMeasurements = savedMeasurements.filter(item => item.id !== id);
            localStorage.setItem('trena_history', JSON.stringify(savedMeasurements));
            renderHistory();
        }

        function clearHistory() {
            if (confirm("Apagar todo o histórico?")) {
                savedMeasurements = [];
                localStorage.removeItem('trena_history');
                renderHistory();
            }
        }

        function switchMode(mode) {
            triggerHaptic();
            currentMode = mode;
            document.getElementById('btn-mode-dist').classList.toggle('active', mode === 'dist');
            document.getElementById('btn-mode-height').classList.toggle('active', mode === 'height');
            
            if (mode === 'dist') {
                actionBtn.style.display = 'none';
                resultDisplay.style.color = "#32d74b";
                updateCalculations();
            } else {
                resetHeightState();
            }
        }

        function resetHeightState() {
            heightStep = 1;
            storedDistanceMeters = 0;
            actionBtn.style.display = 'inline-block';
            actionBtn.innerText = "📍 Fixar Base";
            actionBtn.style.backgroundColor = "#34c759";
            actionBtn.style.color = "#fff";
            resultDisplay.innerText = "Mire na BASE";
            resultDisplay.style.color = "#ff453a";
            subInfo.innerText = "Fixe a distância primeiro";
            setCrosshairColor(false);
        }

        function handleAction() {
            triggerHaptic();
            if (heightStep === 1) {
                const d = getBaseDistance();
                if (d === null) {
                    alert("Mire no chão primeiro.");
                    return;
                }
                storedDistanceMeters = d;
                heightStep = 2;
                actionBtn.innerText = "🔄 Resetar Topo";
                actionBtn.style.backgroundColor = "#ff9f0a";
                resultDisplay.innerText = "Mire no TOPO";
                subInfo.innerText = `Erga o celular!`;
            } else {
                resetHeightState();
            }
        }

        userHeightInput.addEventListener('input', updateCalculations);
    </script>
</body>
</html>
